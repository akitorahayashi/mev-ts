source:
  owner: akitorahayashi
  default_ssh_host: github.com

marketplaces:
  - client: claude
    repository: agent-device-plugin
    name: agent-device-plugin
    plugins:
      - agent-device
      - device-verification
    # To uninstall a plugin, move its name out of plugins into an uninstall
    # list on the same entry:
    #   plugins: [agent-device]
    #   uninstall: [device-verification]
  - client: claude
    repository: comment-review
    name: comment-review
    plugins:
      - comment-review
  - client: claude
    repository: xlsx
    name: xlsx
    plugins:
      - xlsx
  - client: codex
    repository: xlsx
    name: xlsx
    plugins:
      - xlsx
# To remove a marketplace and uninstall the plugins it still has installed,
# delete its entry above and name it at the end of this file:
#   removed_marketplaces:
#     - client: claude
#       name: comment-review
