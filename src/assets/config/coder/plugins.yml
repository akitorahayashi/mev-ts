# Agent plugin marketplaces for Claude Code and Codex.
# Each entry:
#   - repo: GitHub repo as owner/name; the marketplace name defaults to the
#       repo name (declare name: only when marketplace.json differs)
#   - clients: any of claude | codex; the entry applies to each listed client
#   - plugins: plugin names installed from this marketplace
marketplaces:
  - repo: akitorahayashi/agent-device
    clients: [claude, codex]
    plugins: [agent-device, diff-verify]
    # To uninstall a plugin, move its name out of plugins into an uninstall
    # list on the same entry:
    #   plugins: [agent-device]
    #   uninstall: [diff-verify]
  - repo: akitorahayashi/work-plugins
    clients: [claude, codex]
    plugins: [backlog, charles-traffic, code-incident-resolution, comment-review, issue-probe, qa-triage, repro-steps]
    uninstall: [direct-answer]
  - repo: akitorahayashi/prune-comments
    clients: [claude, codex]
    plugins: [prune-comments]
  - repo: akitorahayashi/simplify
    clients: [claude, codex]
    plugins: [simplify]
  - repo: akitorahayashi/xlsx
    clients: [claude, codex]
    plugins: [xlsx]
  - repo: akitorahayashi/worktree-crew
    clients: [claude, codex]
    plugins: [worktree-crew]
  - repo: akitorahayashi/iphone-duo-playbook
    clients: [claude, codex]
    plugins: [iphone-duo]
# To remove a marketplace and uninstall the plugins it still has installed,
# delete its entry above and move its repo and clients lines here:
#   removed_marketplaces:
#     - repo: akitorahayashi/comment-review
#       clients: [claude]
removed_marketplaces:
  - repo: akitorahayashi/agent-device-plugin
    clients: [claude, codex]
  - repo: akitorahayashi/backlog
    clients: [claude, codex]
  - repo: akitorahayashi/charles-traffic
    clients: [claude, codex]
  - repo: akitorahayashi/code-incident-resolution
    clients: [claude, codex]
  - repo: akitorahayashi/comment-review
    clients: [claude, codex]
  - repo: akitorahayashi/issue-probe
    clients: [claude, codex]
  - repo: akitorahayashi/qa-triage
    clients: [claude, codex]
  - repo: akitorahayashi/repro-steps
    clients: [claude, codex]
