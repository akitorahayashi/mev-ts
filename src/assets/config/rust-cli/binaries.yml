---
# Prebuilt Rust CLI binaries fetched from GitHub Releases into ~/.cargo/bin.
# Each entry:
#   - name: binary name, also the release asset's <name> segment (required)
#   - repo: GitHub repo as owner/name (required)
#   - tag: `latest` to track the repository's newest release, or an exact
#     release tag to pin (required)
# A `latest` entry is resolved when the binary is absent and re-resolved only
# under `--update`; a pinned tag is never re-resolved. Idempotency comes from
# `<binary> --version`, so every declared binary must report `<name> <version>`
# and its release tag must be that version, optionally prefixed with `v`. Only
# the version is compared, so changing an entry's repo without changing its
# version leaves the old repository's binary installed; change the tag too, or
# remove the binary, to force the reinstall.
binaries:
  - name: kpv
    repo: akitorahayashi/kpv
    tag: latest
  - name: prf
    repo: akitorahayashi/prf
    tag: latest
  - name: ssv
    repo: akitorahayashi/ssv
    tag: latest
  - name: tc
    repo: akitorahayashi/tmpc
    tag: latest
